services:
  backend:
    # Inject bind mount on host machine
    volumes:
      - ./backend:/app
    # Run python app with hot-reloading
    command: uvicorn main:app --host 0.0.0.0 --port 5000 --reload

  db:
    # Dev-only: expose Postgres to the host for local DB tooling. The base
    # compose file keeps it internal-only for production.
    ports:
      - "5432:5432"

  frontend:
    # Dev: build only the node stage (deps + source) and run the CRA dev server
    # with hot reload. Production/CI uses the full multi-stage build, which
    # serves the compiled app from nginx instead.
    build:
      context: ./react-app
      dockerfile: Dockerfile.react
      target: base
    # Inject host system frontend app using bind mount
    volumes:
      - ./react-app:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
    command: npm run start