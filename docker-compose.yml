#version: '3.8' # Specify the Docker Compose file format version

services:
  # Define the Python web server service
  backend:
    build:
      context: ./backend # Build context is the 'backend' directory
      dockerfile: Dockerfile.fastapi
    container_name: python_web_server 
    networks:
      - net
    ports:
      - "127.0.0.1:5000:5000"
    expose:
      - 5000
    volumes:
      - uploads_data:/app/uploads
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB} # The name of the database to create
      DB_USER: ${POSTGRES_USER} # A user for the database
      DB_PASSWORD: ${POSTGRES_PASSWORD} # Password for the user
      # Security config consumed by the backend. JWT_SECRET_KEY is REQUIRED when
      # APP_ENV=production (the app refuses to start without it). CORS origins
      # must be set to the real frontend domain(s) in production.
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      # Master secret for PII field encryption (AES-256-GCM). REQUIRED when
      # APP_ENV=production. Injected at runtime only — never bake it into the image.
      MASTER_KEY: ${MASTER_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Password-reset email (Gmail SMTP). If the Gmail vars are unset the backend
      # falls back to printing the reset link to its logs instead of sending.
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Cesffo}
      # Base URL used to build the reset link in the email.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    depends_on:
      db: # Ensure the 'db' service starts before the 'web' service
        condition: service_healthy
        restart: true
    healthcheck:
      # CMD-SHELL takes ONE shell string. python is guaranteed present in the image (curl is not).
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthcheck')\""]
      interval: 10s
      timeout: 10s
      retries: 5

  # PostgreSQL database service
  db:
    build:
      context: ./postgres # Build context is the 'postgres' directory
      dockerfile: Dockerfile.postgres
    container_name: postgres_database
    # No host port publish: the database is reachable only on the internal
    # Docker network (via `expose`). The dev override re-publishes 5432 to the
    # host for local DB tooling.
    networks:
      - net
    expose:
      - 5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB} # The name of the database to create
      POSTGRES_USER: postgres # A user for the database
      POSTGRES_PASSWORD: ${POSTGRES_SECRET} # Password for the user
      APP_USER: ${POSTGRES_USER}
      APP_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Persist PostgreSQL data to a named volume
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Single shell string. Passing -U avoids pg_isready falling back to the
      # 'root' OS user (which has no DB role) and spamming FATAL log lines.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
  
  # React frontend service
  frontend:
    build:
      context: ./react-app 
      dockerfile: Dockerfile.react
    container_name: react_frontend
    networks:
      - net
    ports:
      - "127.0.0.1:3000:3000" 
   
    depends_on:
      - backend # Ensure the web backend is running before the frontend starts

# Define named volumes (if used)
volumes:
  db_data: # This will create a Docker volume named 'db_data'
  uploads_data:

networks:
  net:
    name: net
    driver: bridge
