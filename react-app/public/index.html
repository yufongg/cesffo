<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e2e3de" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#2a2521" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Cesffo — learn financial literacy through structured courses and tools.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Cesffo — Financial Literacy, Made Practical</title>
    <script>
      // Apply the saved (or system-preferred) theme BEFORE first paint so the
      // page never flashes the wrong colours on refresh. ThemeToggle reads this
      // attribute back on mount, so the choice survives reloads.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
