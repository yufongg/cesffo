# Serves the compiled React build inside the frontend container (port 3000,
# matching the compose port mapping). Replaces the CRA dev server's proxying:
# /api, /healthcheck and /ws are forwarded to the backend service so the SPA's
# same-origin fetch()/WebSocket calls keep working in local compose and CI.

server {
    listen 3000;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Document-level security headers for the SPA itself (the backend sets its
    # own headers on API responses). No inline scripts exist in the build
    # (INLINE_RUNTIME_CHUNK=false), so script-src can stay 'self'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # fonts.googleapis.com/gstatic allowances cover the Google Fonts links in index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Long-lived caching for content-hashed build assets only.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Backend API (service DNS name on the compose network).
    location /api/ {
        proxy_pass http://python_web_server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthcheck {
        proxy_pass http://python_web_server:5000;
        proxy_set_header Host $host;
    }

    # Forum image uploads (served by the backend's /uploads StaticFiles mount).
    # Without this the SPA fallback below answers with index.html, which breaks
    # <img> tags and 404s the direct link.
    location /uploads/ {
        proxy_pass http://python_web_server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Forum WebSocket.
    location /ws {
        proxy_pass http://python_web_server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: client-side routes (react-router) resolve to index.html.
    location / {
        try_files $uri /index.html;
    }
}
