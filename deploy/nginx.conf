# Production reverse-proxy / TLS termination for cesffo (EC2 host).
#
# Reviewable copy of the nginx site configuration referenced in Report II §2.3.
# Deployed on the VM (sites-available/sites-enabled). The certificate is a
# CA-issued Let's Encrypt certificate for cesffo.rawwrffle.com, provisioned and
# auto-renewed by certbot. [TEAM: diff against the live file after any certbot
# re-run so this copy stays authoritative.]

# Redirect all plaintext HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cesffo.rawwrffle.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cesffo.rawwrffle.com;

    # --- TLS (verified live: TLS 1.3 preferred, TLS 1.2 fallback, 1.0/1.1 refused) ---
    # Let's Encrypt cert + key, managed by certbot; the private key never leaves
    # the VM, is readable only by root, and is never committed or baked into images.
    ssl_certificate     /etc/letsencrypt/live/cesffo.rawwrffle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cesffo.rawwrffle.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.3 suites are built in (AES-GCM / CHACHA20-POLY1305); TLS 1.2 is
    # restricted to ephemeral-ECDHE AEAD suites only — forward secrecy on every
    # connection, no CBC/MAC-then-encrypt constructions.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;

    # Browsers must refuse plaintext for a year once they have seen this site.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Don't advertise the nginx version in headers or error pages.
    server_tokens off;

    # --- Backend API (FastAPI on the Docker loopback binding) ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /healthcheck {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # WebSocket endpoint for the forum.
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # --- Frontend (compiled React build served by the container's nginx) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Defence in depth: the static build emits none of these, but strip any
        # fingerprint/permissive-CORS headers should the upstream ever change.
        proxy_hide_header X-Powered-By;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }
}
