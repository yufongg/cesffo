# Production reverse-proxy / TLS termination for cesffo (EC2 host).
#
# This file is the reviewable copy of the nginx site configuration referenced in
# Report II §2.3. Deployed at /etc/nginx/sites-available/cesffo on the VM.
# [TEAM: diff this against the live config on the EC2 host before the D2 freeze
# and reconcile any drift — in particular the certificate/key paths below.]

# Redirect all plaintext HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 18.117.220.171;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 18.117.220.171;

    # --- TLS (verified live: TLS 1.3 + 1.2 only, AEAD suites, TLS 1.0/1.1 refused) ---
    # Self-signed certificate: the deployment address is a bare IP, which public CAs
    # will not issue for; authenticity is anchored by out-of-band fingerprint
    # distribution to the QA team (see Report II §2.3).
    ssl_certificate     /etc/ssl/certs/cesffo-selfsigned.crt;   # [TEAM: confirm path]
    ssl_certificate_key /etc/ssl/private/cesffo-selfsigned.key; # [TEAM: confirm path; must be root-only, mode 600]

    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.3 suites are built in (AES-GCM/CHACHA20); restrict TLS 1.2 to ECDHE + AEAD
    # so every accepted suite has forward secrecy and no CBC/MAC-then-encrypt modes.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;

    # Browsers must refuse plaintext for a year once they have seen this site.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Don't advertise the nginx version in headers or error pages.
    server_tokens off;

    # --- Backend API (FastAPI on the Docker loopback binding) ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /healthcheck {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # WebSocket endpoint for the forum.
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # --- Frontend (compiled React build served by the container's nginx) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Defence in depth: the static build emits none of these, but strip any
        # fingerprint/permissive-CORS headers should the upstream ever change.
        proxy_hide_header X-Powered-By;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }
}
