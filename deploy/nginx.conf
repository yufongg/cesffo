server {
    listen 80;
    server_name cesffo.rawwrffle.com 18.117.220.171 _;                # put your domain here later

    return 301 https://cesffo.rawwrffle.com$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    return 301 https://cesffo.rawwrffle.com$request_uri;
}


# --- HTTPS: TLS termination + reverse proxy ---
server {
    listen 443 ssl;
    server_name cesffo.rawwrffle.com;                 # put your domain here later

    client_max_body_size 25m;      # your app accepts file uploads

    # --- Self-signed certificate ---
    ssl_certificate     /etc/letsencrypt/live/cesffo.rawwrffle.com/cert.pem;
    ssl_certificate_key /etc/letsencrypt/live/cesffo.rawwrffle.com/privkey.pem;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Modern, AEAD-only, forward-secret TLS ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — your app sends this too; reinforcing at the proxy is harmless
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- REST API + forum WebSocket -> FastAPI backend ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;       # NO trailing slash: keeps the /api/ prefix
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;               # keep long-lived WS alive
    }

    # --- Everything else -> React dev server ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;   # dev-server hot-reload socket
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}